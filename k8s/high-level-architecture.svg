<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Kubernetes high-level architecture</title>
  <desc id="description">External access sends requests to the control plane. The control plane stores desired state and assigns Pods to worker nodes. A worker node creates Pods and uses kube-proxy to forward Service traffic.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#334155" />
    </marker>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; fill: #172033; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .group-title { font-size: 16px; font-weight: 700; letter-spacing: .5px; }
      .node-title { font-size: 15px; font-weight: 700; }
      .node-subtitle { font-size: 12px; fill: #475569; }
      .label { font-size: 12px; fill: #334155; }
      .area { stroke-width: 2; rx: 15; }
      .external { fill: #f8fafc; stroke: #64748b; }
      .control { fill: #eff6ff; stroke: #2563eb; }
      .data { fill: #ecfdf5; stroke: #059669; }
      .worker { fill: #f0fdf4; stroke: #34a16b; stroke-width: 1.5; rx: 12; }
      .node { fill: #ffffff; stroke: #475569; stroke-width: 1.5; rx: 9; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .exchange { fill: none; stroke: #334155; stroke-width: 2; marker-start: url(#arrow-start); marker-end: url(#arrow); }
      .update { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .legend { font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect width="1440" height="760" fill="#ffffff" />
  <text class="title" x="32" y="43">Kubernetes cluster — high-level architecture</text>
  <text class="subtitle" x="32" y="72">The control plane stores and assigns desired state; worker nodes run Pods and implement Service traffic.</text>

  <rect class="area external" x="30" y="130" width="430" height="530" />
  <text class="group-title" x="52" y="165">EXTERNAL ACCESS</text>

  <rect class="area control" x="490" y="130" width="430" height="530" />
  <text class="group-title" x="512" y="165">CONTROL PLANE</text>

  <rect class="area data" x="950" y="130" width="460" height="530" />
  <text class="group-title" x="972" y="165">DATA PLANE</text>
  <rect class="worker" x="980" y="190" width="405" height="430" />
  <text class="node-subtitle" x="1000" y="216">WORKER NODE</text>

  <rect class="node" x="55" y="235" width="112" height="64" />
  <text class="node-title" x="111" y="273" text-anchor="middle">Operator</text>
  <rect class="node" x="195" y="235" width="112" height="64" />
  <text class="node-title" x="251" y="273" text-anchor="middle">kubectl</text>
  <rect class="node" x="335" y="235" width="110" height="64" />
  <text class="node-title" x="390" y="260" text-anchor="middle">API</text>
  <text class="node-subtitle" x="390" y="280" text-anchor="middle">endpoint</text>

  <path class="arrow" d="M 167 267 H 195" />
  <path class="arrow" d="M 307 267 H 335" />
  <path class="arrow" d="M 445 267 H 485 V 256 H 535" />

  <rect class="node" x="535" y="220" width="160" height="72" />
  <text class="node-title" x="615" y="250" text-anchor="middle">kube-apiserver</text>
  <text class="node-subtitle" x="615" y="272" text-anchor="middle">validates API requests</text>

  <rect class="node" x="750" y="220" width="140" height="72" />
  <text class="node-title" x="820" y="250" text-anchor="middle">etcd</text>
  <text class="node-subtitle" x="820" y="272" text-anchor="middle">desired cluster state</text>
  <path class="arrow" d="M 695 256 H 750" />

  <rect class="node" x="535" y="390" width="160" height="72" />
  <text class="node-title" x="615" y="420" text-anchor="middle">kube-scheduler</text>
  <text class="node-subtitle" x="615" y="442" text-anchor="middle">selects a worker node</text>
  <path class="exchange" d="M 615 292 V 390" />
  <text class="label" x="624" y="348">watch / bind</text>

  <rect class="node" x="740" y="390" width="160" height="72" />
  <text class="node-title" text-anchor="middle">
    <tspan x="820" y="411">kube-controller-</tspan>
    <tspan x="820" y="428">manager</tspan>
  </text>
  <text class="node-subtitle" x="820" y="449" text-anchor="middle">reconciles desired state</text>
  <path class="exchange" d="M 695 280 H 720 V 426 H 740" />
  <text class="label" x="710" y="483">controller reconciliation loop</text>

  <rect class="node" x="1005" y="240" width="115" height="68" />
  <text class="node-title" x="1062" y="269" text-anchor="middle">kubelet</text>
  <text class="node-subtitle" x="1062" y="290" text-anchor="middle">runs assigned Pods</text>
  <rect class="node" x="1150" y="240" width="125" height="68" />
  <text class="node-title" text-anchor="middle">
    <tspan x="1212" y="263">Container</tspan>
    <tspan x="1212" y="280">runtime</tspan>
  </text>
  <text class="node-subtitle" x="1212" y="299" text-anchor="middle">CRI</text>
  <rect class="node" x="1295" y="240" width="80" height="68" />
  <text class="node-title" x="1335" y="269" text-anchor="middle">Pod</text>
  <text class="node-subtitle" x="1335" y="290" text-anchor="middle">containers</text>
  <path class="arrow" d="M 1120 274 H 1150" />
  <path class="arrow" d="M 1275 274 H 1295" />

  <rect class="node" x="1150" y="360" width="125" height="60" />
  <text class="node-title" x="1212" y="386" text-anchor="middle">CNI plugin</text>
  <text class="node-subtitle" x="1212" y="405" text-anchor="middle">Pod networking</text>
  <path class="arrow" d="M 1212 308 V 360" />

  <rect class="node" x="1290" y="470" width="90" height="62" />
  <text class="node-title" x="1335" y="495" text-anchor="middle">kube-proxy</text>
  <text class="node-subtitle" x="1335" y="515" text-anchor="middle">Service routing</text>
  <path class="arrow" d="M 1335 470 V 308" />

  <path class="arrow" d="M 615 220 V 187 H 930 V 274 H 1005" />
  <text class="label" x="785" y="180">assigned Pod specification</text>
  <path class="update" d="M 535 280 H 510 V 550 H 1335 V 532" />
  <text class="label" x="780" y="542">Service / EndpointSlice updates</text>

  <line class="arrow" x1="55" y1="705" x2="95" y2="705" />
  <text class="legend" x="108" y="709">Pod lifecycle / component interaction</text>
  <line class="update" x1="400" y1="705" x2="440" y2="705" />
  <text class="legend" x="453" y="709">Ongoing Service configuration updates</text>
</svg>
