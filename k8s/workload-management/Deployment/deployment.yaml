apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: my-app
    env: dev
    type: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      name: nginx
      labels:
        app: my-app
        env: dev
        type: frontend
    spec:
      containers:
        - name: nginx
          image: nginx