<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="390" viewBox="0 0 1160 390" role="img" aria-labelledby="title desc">
  <title id="title">NodePort Service client request flow</title>
  <desc id="desc">An external client connects to a cluster node on NodePort 30080. The node service data plane forwards the request through the NodePort Service to a ready backend Pod. The response returns to the client.</desc>
  <defs>
    <!-- Solid Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="#70757a" />
    </marker>

    <!-- Drop Shadow for Boxes -->
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1160" height="390" fill="#ffffff" />

  <!-- Cluster Boundary -->
  <rect x="330" y="55" width="810" height="315" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="348" y="50" font-size="12.5" fill="#64748b" font-weight="600">KUBERNETES CLUSTER</text>

  <!-- Worker Node A Container -->
  <rect x="350" y="90" width="320" height="260" rx="8" fill="#fafafa" stroke="#f0f0f0" stroke-width="1.5" />
  <text x="510" y="113" text-anchor="middle" font-size="13.5" fill="#4a5568" font-weight="500">Worker Node A (172.22.0.4)</text>

  <!-- Worker Node B Container -->
  <rect x="900" y="185" width="220" height="125" rx="8" fill="#fafafa" stroke="#f0f0f0" stroke-width="1.5" />
  <text x="1010" y="208" text-anchor="middle" font-size="13.5" fill="#4a5568" font-weight="500">Worker Node B — backend</text>

  <!-- ==================== NODES / BOXES ==================== -->

  <!-- External Client -->
  <g filter="url(#box-shadow)">
    <rect x="20" y="195" width="165" height="90" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="102.5" y="220" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">EXTERNAL CLIENT</text>
    <text x="102.5" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Browser / curl</text>
    <text x="102.5" y="256" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">http://172.22.0</text>
    <text x="102.5" y="272" text-anchor="middle" font-size="11" fill="#64748b">(No CoreDNS lookup)</text>
  </g>

  <!-- NodePort Interface -->
  <g filter="url(#box-shadow)">
    <rect x="385" y="215" width="250" height="75" rx="10" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="510" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">NodePort Listener</text>
    <text x="510" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">0.0.0.0:30080</text>
    <text x="510" y="275" text-anchor="middle" font-size="11.5" fill="#1e3a8a">(Opened on every cluster node)</text>
  </g>

  <!-- Service data plane -->
  <g filter="url(#box-shadow)">
    <rect x="415" y="128" width="190" height="60" rx="14" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="510" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Service data plane</text>
    <text x="510" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">kube-proxy or CNI</text>
  </g>

  <!-- NodePort + ClusterIP Service -->
  <g filter="url(#box-shadow)">
    <rect x="915" y="90" width="190" height="80" rx="10" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="1010" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">NodePort Service</text>
    <text x="1010" y="131" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">NodePort: 30080</text>
    <text x="1010" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">ClusterIP: 10.96.0.70:80</text>
    <text x="1010" y="163" text-anchor="middle" font-size="11" fill="#1e3a8a">(Built on top of ClusterIP)</text>
  </g>

  <!-- Ready backend Pod -->
  <g filter="url(#box-shadow)">
    <rect x="925" y="225" width="170" height="65" rx="10" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="1010" y="254" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Ready backend Pod</text>
    <text x="1010" y="272" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">10.244.1.23:8080</text>
  </g>

  <!-- ==================== CONNECTORS & NUMBERED LABELS ==================== -->

  <!-- Step 1: Sends HTTP request to NodeIP:NodePort (External Client -> NodePort Listener) -->
  <path d="M 185 245 L 378 245" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="195" y="232" width="172" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="209" cy="245" r="9" fill="#1e3a8a" />
  <text x="209" y="249" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="289" y="249" text-anchor="middle" font-size="11.5" fill="#334155">Hits NodeIP:30080</text>

  <!-- Step 2: Maps NodePort to Service (NodePort Listener -> NodePort Service) -->
  <path d="M 635 235 L 675 235 Q 685 235 685 225 L 685 140 Q 685 130 695 130 L 908 130" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="695" y="117" width="180" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="709" cy="130" r="9" fill="#1e3a8a" />
  <text x="709" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="804" y="134" text-anchor="middle" font-size="11.5" fill="#334155">Routes to ClusterIP layer</text>

  <!-- Step 3: Translates & SNATs packet (NodePort Service -> Service data plane) -->
  <path d="M 915 105 L 905 105 Q 895 105 895 95 L 895 82 Q 895 72 885 72 L 365 72 Q 355 72 355 82 L 355 148 Q 355 158 365 158 L 408 158" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="695" y="59" width="185" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="709" cy="72" r="9" fill="#1e3a8a" />
  <text x="709" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="796" y="76" text-anchor="middle" font-size="11.5" fill="#334155">DNAT + SNAT translation</text>

  <!-- Step 4: Forwards request across nodes (Service data plane -> Ready backend Pod) -->
  <path d="M 605 158 L 625 158 Q 635 158 635 168 L 635 250 Q 635 260 645 260 L 918 260" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="710" y="247" width="145" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="724" cy="260" r="9" fill="#1e3a8a" />
  <text x="724" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="791" y="264" text-anchor="middle" font-size="11.5" fill="#334155">Forwards request</text>

  <!-- Step 5: Response returns via Node A (Ready backend Pod -> External Client, Dashed Line) -->
  <path d="M 1010 290 L 1010 330 Q 1010 340 1000 340 L 112.5 340 Q 102.5 340 102.5 330 L 102.5 292" fill="none" stroke="#80868b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" />
  <rect x="460" y="327" width="215" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="474" cy="340" r="9" fill="#1e3a8a" />
  <text x="474" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="576" y="344" text-anchor="middle" font-size="11.5" fill="#334155">Response (via Node A SNAT)</text>
</svg>
