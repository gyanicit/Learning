apiVersion: v1
kind: Service
metadata:
  name: my-nodeport-service
spec:
  type: NodePort
  selector:
    app: my-app          # Must match the labels on your Pods
  ports:
    - protocol: TCP
      port: 80           # Port exposed internally inside the cluster (ClusterIP)
      targetPort: 80     # Port your container is listening on
      nodePort: 30080    # Optional: External port on every Node (range: 30000-32767)