<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <defs>
    <!-- Solid Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="#70757a" />
    </marker>

    <!-- Drop Shadow for Boxes -->
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="410" fill="#ffffff" />

  <!-- Cluster Boundary -->
  <rect x="490" y="55" width="770" height="335" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="508" y="50" font-size="12.5" fill="#64748b" font-weight="600">KUBERNETES CLUSTER</text>

  <!-- Worker Node A Container -->
  <rect x="510" y="92" width="310" height="275" rx="8" fill="#fafafa" stroke="#f0f0f0" stroke-width="1.5" />
  <text x="665" y="115" text-anchor="middle" font-size="13.5" fill="#4a5568" font-weight="500">Worker Node A (172.22.0.4)</text>

  <!-- Worker Node B Container -->
  <rect x="1030" y="205" width="210" height="125" rx="8" fill="#fafafa" stroke="#f0f0f0" stroke-width="1.5" />
  <text x="1135" y="228" text-anchor="middle" font-size="13.5" fill="#4a5568" font-weight="500">Worker Node B — backend</text>

  <!-- ==================== NODES / BOXES ==================== -->

  <!-- External Client -->
  <g filter="url(#box-shadow)">
    <rect x="20" y="205" width="150" height="85" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="95" y="232" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">EXTERNAL CLIENT</text>
    <text x="95" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Browser / curl</text>
    <text x="95" y="268" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">http://203.0.113.10:80</text>
  </g>

  <!-- External Cloud Load Balancer -->
  <g filter="url(#box-shadow)">
    <rect x="275" y="195" width="185" height="105" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5" />
    <text x="367.5" y="220" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Cloud Load Balancer</text>
    <text x="367.5" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">External IP: 203.0.113.10</text>
    <text x="367.5" y="255" text-anchor="middle" font-size="11.5" fill="#92400e">Port: 80 → NodePort: 30080</text>
    <text x="367.5" y="274" text-anchor="middle" font-size="11" fill="#b45309">(AWS ELB / GCP / MetalLB)</text>
  </g>

  <!-- NodePort Listener -->
  <g filter="url(#box-shadow)">
    <rect x="540" y="220" width="250" height="75" rx="10" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="665" y="245" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">NodePort Listener</text>
    <text x="665" y="263" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">0.0.0.0:30080</text>
    <text x="665" y="280" text-anchor="middle" font-size="11.5" fill="#1e3a8a">(Health-checked by Cloud LB)</text>
  </g>

  <!-- Service data plane -->
  <g filter="url(#box-shadow)">
    <rect x="570" y="130" width="190" height="60" rx="14" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="665" y="157" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Service data plane</text>
    <text x="665" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">kube-proxy or CNI</text>
  </g>

  <!-- LoadBalancer Service Definition -->
  <g filter="url(#box-shadow)">
    <rect x="1030" y="88" width="210" height="90" rx="10" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="1135" y="110" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">LoadBalancer Service</text>
    <text x="1135" y="127" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">External: 203.0.113.10:80</text>
    <text x="1135" y="143" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">NodePort: 30080</text>
    <text x="1135" y="159" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">ClusterIP: 10.96.0.70:80</text>
    <text x="1135" y="172" text-anchor="middle" font-size="10.5" fill="#1e3a8a">(Wraps NodePort + ClusterIP)</text>
  </g>

  <!-- Ready backend Pod -->
  <g filter="url(#box-shadow)">
    <rect x="1050" y="245" width="170" height="65" rx="10" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="1135" y="274" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Ready backend Pod</text>
    <text x="1135" y="292" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">10.244.1.23:8080</text>
  </g>

  <!-- ==================== CONNECTORS & NUMBERED LABELS ==================== -->

  <!-- Step 1: Hits External IP:80 (External Client -> Cloud Load Balancer) -->
  <path d="M 170 247 L 268 247" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="176" y="213" width="92" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="189" cy="225" r="8.5" fill="#92400e" />
  <text x="189" y="229" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">1</text>
  <text x="231" y="229" text-anchor="middle" font-size="11" fill="#334155">Port 80</text>

  <!-- Step 2: Forwards to Healthy NodePort (Cloud Load Balancer -> NodePort Listener) -->
  <path d="M 460 247 L 533 247" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="448" y="213" width="102" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="461" cy="225" r="8.5" fill="#1e3a8a" />
  <text x="461" y="229" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">2</text>
  <text x="507" y="229" text-anchor="middle" font-size="11" fill="#334155">:30080</text>

  <!-- Step 3: Routes to ClusterIP layer (NodePort Listener -> LoadBalancer Service) -->
  <path d="M 790 242 L 825 242 Q 835 242 835 232 L 835 143 Q 835 133 845 133 L 1023 133" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="842" y="120" width="180" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="856" cy="133" r="9" fill="#1e3a8a" />
  <text x="856" y="137" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="940" y="137" text-anchor="middle" font-size="11.5" fill="#334155">Routes to ClusterIP</text>

  <!-- Step 4: DNAT + SNAT translation (LoadBalancer Service -> Service data plane) -->
  <path d="M 1030 105 L 1020 105 Q 1010 105 1010 95 L 1010 82 Q 1010 72 1000 72 L 530 72 Q 520 72 520 82 L 520 150 Q 520 160 530 160 L 563 160" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="835" y="59" width="165" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="849" cy="72" r="9" fill="#1e3a8a" />
  <text x="849" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="926" y="76" text-anchor="middle" font-size="11.5" fill="#334155">DNAT + SNAT</text>

  <!-- Step 5: Forwards request across nodes (Service data plane -> Ready backend Pod) -->
  <path d="M 760 160 L 780 160 Q 790 160 790 170 L 790 268 Q 790 278 800 278 L 1043 278" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="850" y="265" width="145" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="864" cy="278" r="9" fill="#1e3a8a" />
  <text x="864" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="931" y="282" text-anchor="middle" font-size="11.5" fill="#334155">Forwards request</text>

  <!-- Step 6: Response returns via Node A & Cloud LB (Ready backend Pod -> External Client, Dashed Line) -->
  <path d="M 1135 310 L 1135 360 Q 1135 370 1125 370 L 105 370 Q 95 370 95 360 L 95 297" fill="none" stroke="#80868b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" />
  <rect x="530" y="357" width="245" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="544" cy="370" r="9" fill="#1e3a8a" />
  <text x="544" y="374" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
  <text x="661" y="374" text-anchor="middle" font-size="11.5" fill="#334155">Response (Node A → Cloud LB → Client)</text>
</svg>
