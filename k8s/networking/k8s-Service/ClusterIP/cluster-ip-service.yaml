apiVersion: v1
kind: Service
metadata:
  name: my-clusterip-service
spec:
  type: ClusterIP        # Optional (default if omitted)
  selector:
    app: my-app          # Must match the labels on your Pods
  ports:
    - protocol: TCP
      port: 80           # Internal Service port other Pods connect to
      targetPort: 80     # Port your container listens on inside the Pod