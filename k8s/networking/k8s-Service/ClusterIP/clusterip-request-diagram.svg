<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
  <defs>
    <!-- Solid Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 9 5 L 1 8 z" fill="#70757a" />
    </marker>

    <!-- Drop Shadow for Boxes -->
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1160" height="360" fill="#ffffff" />

  <!-- Worker Node A Container -->
  <rect x="360" y="65" width="300" height="250" rx="8" fill="#fafafa" stroke="#f0f0f0" stroke-width="1.5" />
  <text x="510" y="88" text-anchor="middle" font-size="13.5" fill="#4a5568" font-weight="500">Worker Node A — client</text>

  <!-- Worker Node B Container -->
  <rect x="920" y="165" width="220" height="120" rx="8" fill="#fafafa" stroke="#f0f0f0" stroke-width="1.5" />
  <text x="1030" y="188" text-anchor="middle" font-size="13.5" fill="#4a5568" font-weight="500">Worker Node B — backend</text>

  <!-- ==================== NODES / BOXES ==================== -->

  <!-- CoreDNS -->
  <g filter="url(#box-shadow)">
    <rect x="20" y="290" width="115" height="55" rx="8" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="77.5" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">CoreDNS</text>
  </g>

  <!-- Service data plane -->
  <g filter="url(#box-shadow)">
    <rect x="415" y="105" width="190" height="60" rx="14" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="510" y="132" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Service data plane</text>
    <text x="510" y="149" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">kube-proxy or CNI</text>
  </g>

  <!-- CLIENT POD -->
  <g filter="url(#box-shadow)">
    <rect x="385" y="190" width="250" height="110" rx="10" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="510" y="213" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">CLIENT POD</text>
    <text x="510" y="230" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Entry point</text>
    <text x="510" y="247" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">curl</text>
    <text x="510" y="264" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">http://my-service.default.svc.cl</text>
    <text x="510" y="281" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">uster.local:80/</text>
  </g>

  <!-- ClusterIP Service -->
  <g filter="url(#box-shadow)">
    <rect x="935" y="75" width="175" height="75" rx="10" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="1022.5" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">ClusterIP Service</text>
    <text x="1022.5" y="119" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">10.96.0.70:80</text>
    <text x="1022.5" y="136" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">(virtual IP)</text>
  </g>

  <!-- Ready backend Pod -->
  <g filter="url(#box-shadow)">
    <rect x="945" y="205" width="170" height="65" rx="10" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="1030" y="234" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Ready backend Pod</text>
    <text x="1030" y="252" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">10.244.1.23:8080</text>
  </g>

  <!-- ==================== CONNECTORS & NUMBERED LABELS ==================== -->

  <!-- Step 1: Looks up Service name (CLIENT POD -> CoreDNS) -->
  <path d="M 635 280 L 675 280 Q 685 280 685 290 L 685 320 Q 685 330 675 330 L 142 330" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="160" y="317" width="180" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="174" cy="330" r="9" fill="#1e3a8a" />
  <text x="174" y="334" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="259" y="334" text-anchor="middle" font-size="12" fill="#334155">Looks up Service name</text>

  <!-- Step 2: Returns ClusterIP (CoreDNS -> CLIENT POD) -->
  <path d="M 135 305 L 145 305 Q 155 305 155 295 L 155 268 Q 155 258 165 258 L 378 258" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="180" y="245" width="145" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="194" cy="258" r="9" fill="#1e3a8a" />
  <text x="194" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="261" y="262" text-anchor="middle" font-size="12" fill="#334155">Returns ClusterIP</text>

  <!-- Step 3: Sends HTTP request to ClusterIP (CLIENT POD -> ClusterIP Service) -->
  <path d="M 635 215 L 675 215 Q 685 215 685 205 L 685 122 Q 685 112 695 112 L 928 112" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="695" y="99" width="215" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="709" cy="112" r="9" fill="#1e3a8a" />
  <text x="709" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="811" y="116" text-anchor="middle" font-size="12" fill="#334155">Sends HTTP request to ClusterIP</text>

  <!-- Step 4: Intercepts & translates VIP (ClusterIP Service -> Service data plane) -->
  <path d="M 935 90 L 925 90 Q 915 90 915 80 L 915 62 Q 915 52 905 52 L 350 52 Q 340 52 340 62 L 340 125 Q 340 135 350 135 L 408 135" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="700" y="39" width="165" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="714" cy="52" r="9" fill="#1e3a8a" />
  <text x="714" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="791" y="56" text-anchor="middle" font-size="12" fill="#334155">Translates virtual IP</text>

  <!-- Step 5: Forwards request (Service data plane -> Ready backend Pod) -->
  <path d="M 605 135 L 625 135 Q 635 135 635 145 L 635 230 Q 635 240 645 240 L 938 240" fill="none" stroke="#80868b" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="720" y="227" width="145" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="734" cy="240" r="9" fill="#1e3a8a" />
  <text x="734" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="801" y="244" text-anchor="middle" font-size="12" fill="#334155">Forwards request</text>

  <!-- Step 6: Response (Ready backend Pod -> CLIENT POD, Dashed Line) -->
  <path d="M 1030 205 L 1030 165 Q 1030 155 1040 155 L 1120 155 Q 1130 155 1130 145 L 1130 35 Q 1130 25 1120 25 L 325 25 Q 315 25 315 35 L 315 215 Q 315 225 325 225 L 378 225" fill="none" stroke="#80868b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)" />
  <rect x="745" y="12" width="102" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
  <circle cx="759" cy="25" r="9" fill="#1e3a8a" />
  <text x="759" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
  <text x="805" y="29" text-anchor="middle" font-size="12" fill="#334155">Response</text>

</svg>